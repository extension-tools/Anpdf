<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="robots" content="noindex,follow">
 <meta name="description" content="「PDF 書き込み」の使い方：拡張機能を固定し、エディターを開いてPDFを選びましょう。">
 <title>「PDF 書き込み」をインストールしました</title>
 <link rel="icon" href="../assets/annotate-pdf.png" type="image/png">
 <link rel="stylesheet" href="../welcome.css">

</head>
<body>
 <main>
  <header class="welcome-header">
   <h1><span>PDF 書き込み</span>を<br class="title-break">インストールしました</h1>
   <p class="intro">3つのステップで始めましょう。</p>
  </header>
  <section class="step" aria-label="「PDF 書き込み」を固定する">
   <div class="step-instructions">
   <p><span class="inline-number">1</span> ブラウザのツールバーにあるパズルのアイコンをクリックします。<br class="desktop-break"> <span class="inline-number">2</span> 「<strong>PDF 書き込み</strong>」を見つけて、ピンのアイコンをクリックします。</p></div>
   <figure class="browser pin-browser" role="img" aria-label="Chromeの操作例：1. パズルのアイコンをクリックします。2. 拡張機能メニューで「PDF 書き込み」の横にあるピンをクリックします。">
    <div aria-hidden="true">
     <div class="chrome-tabs"></div>
 <div class="chrome-address"><span class="back"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></span><span class="address"></span><span class="toolbar-target puzzle target"><svg class="icon browser-puzzle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h5V4a2 2 0 0 1 4 0v1h5a1 1 0 0 1 1 1v4h1a2 2 0 0 1 0 4h-1v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5h1a3 3 0 0 0 0-6H4V6a1 1 0 0 1 1-1Z"/></svg><b class="callout">1<svg class="guide-arrow" viewBox="0 0 200 64" fill="none" aria-hidden="true"><path class="arrow-shaft" d="M8 28 C72 -8 135 17 196 48"/><path class="arrow-head" d="M183 34 L196 48 L177 49"/></svg></b></span><span class="browser-more"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></span></div>
     <div class="browser-content"><div class="ghost-page"><span class="ghost-brand"><img src="../assets/annotate-pdf.png" width="32" height="32" alt=""> Annotate PDF</span><span class="ghost-line"></span><span class="ghost-line short"></span><span class="ghost-line"></span><span class="ghost-highlight"></span><span class="ghost-line short"></span></div></div>
     <div class="extension-menu"><div class="menu-heading">拡張機能 <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></div><p class="menu-note">アクセス不要</p><p class="menu-description">これらの拡張機能は、このサイトの情報の読み取りや変更を必要としません。</p>
      <div class="extension-row"><img src="../assets/annotate-pdf.png" width="32" height="32" alt=""><span>PDF 書き込み</span><span class="pin-target target"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3H8l1 7-3 3v3h12v-3l-3-3 1-7Z"/><path d="M12 16v6"/></svg><b class="callout">2<svg class="guide-arrow" viewBox="0 0 200 64" fill="none" aria-hidden="true"><path class="arrow-shaft" d="M8 28 C72 -8 135 17 196 48"/><path class="arrow-head" d="M183 34 L196 48 L177 49"/></svg></b></span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></div>
      <div class="menu-footer"><svg class="icon browser-puzzle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h5V4a2 2 0 0 1 4 0v1h5a1 1 0 0 1 1 1v4h1a2 2 0 0 1 0 4h-1v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5h1a3 3 0 0 0 0-6H4V6a1 1 0 0 1 1-1Z"/></svg> 拡張機能を管理</div>
     </div>
     <div class="pin-note">固定すれば、ワンクリックで開けます。</div>
    </div>
   </figure>
  </section>
  <section class="step open-step" aria-label="PDFを開く">
   <div class="step-instructions">
   <p><span class="inline-number">3</span> 「<strong>PDF 書き込み</strong>」のアイコンをクリックし、<br class="desktop-break">「<strong>PDFを開く</strong>」からファイルを選びます。</p></div>
   <figure class="browser open-browser" role="img" aria-label="Chromeの操作例：3. 固定した「PDF 書き込み」のアイコンをクリックしてエディターを開きます。「PDFを開く」をクリックして端末内のファイルを選びます。">
    <div aria-hidden="true">
     <div class="chrome-tabs"></div>
 <div class="chrome-address"><span class="back"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></span><span class="address"></span><span class="toolbar-target pinned"><img src="../assets/annotate-pdf.png" width="32" height="32" alt=""><b class="callout">3<svg class="guide-arrow" viewBox="0 0 200 64" fill="none" aria-hidden="true"><path class="arrow-shaft" d="M8 28 C72 -8 135 17 196 48"/><path class="arrow-head" d="M183 34 L196 48 L177 49"/></svg></b></span><span class="toolbar-target puzzle"><svg class="icon browser-puzzle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h5V4a2 2 0 0 1 4 0v1h5a1 1 0 0 1 1 1v4h1a2 2 0 0 1 0 4h-1v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5h1a3 3 0 0 0 0-6H4V6a1 1 0 0 1 1-1Z"/></svg></span><span class="browser-more"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></span></div>
     <div class="start-preview"><span class="preview-brand"><img src="../assets/annotate-pdf.png" width="32" height="32" alt=""> Annotate PDF</span><span class="preview-description">PDFにハイライトや注釈を追加。</span><div class="preview-drop"><span>ここにPDFをドラッグ＆ドロップ</span><span class="preview-open"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg> PDFを開く</span></div></div>
    </div>
   </figure>
  </section>
 </main>

</html>
